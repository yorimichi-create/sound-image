<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Image</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Sound Image</h1>

    <input id="imageInput" type="file" accept="image/*">

    <button id="micButton">
      マイクを開始
    </button>
    <div id="volumeDisplay">VOLUME 0</div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="A">A：膨張</button>
      <button class="mode-tab" data-mode="B">B：ギザギザ</button>
      <button class="mode-tab" data-mode="C">C：波</button>
    </div>

    <canvas id="canvas"></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
